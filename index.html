    <style>
      /* Painted before the bundle arrives so there is never a white flash. */
      html { background: #070a12; color-scheme: dark; }
      body { margin: 0; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #070a12; z-index: 100;
        transition: opacity 480ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      #boot span {
        width: 1px; height: 44px;
        background: linear-gradient(to bottom, transparent, #6c8aff, transparent);
        animation: bootline 1.4s ease-in-out infinite;
      }
      @keyframes bootline { 0%,100% { opacity: .15; transform: scaleY(.4) } 50% { opacity: 1; transform: scaleY(1) } }
      .booted #boot { opacity: 0; pointer-events: none; }
    </style>
